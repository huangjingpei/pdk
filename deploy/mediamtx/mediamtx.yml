logLevel: info
logDestinations: [stdout]

authMethod: http
# Docker Compose 使用 MTX_AUTHHTTPADDRESS 环境变量覆盖并注入内部服务令牌。
authHTTPAddress: http://backend:8080/api/v1/internal/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: true
apiAddress: :9997
metrics: true
metricsAddress: :9998

# 当前部署承担 ZHIBO_LIVE 的 RTMP 推流与 HLS 拉流；其他协议保持关闭。
rtsp: false
rtmp: true
rtmpAddress: :1935
hls: true
hlsAddress: :8888
webrtc: false
srt: false
moq: false

pathDefaults:
  overridePublisher: false
  runOnAvailable: /usr/local/bin/pdk-mediamtx-event available
  runOnUnavailable: /usr/local/bin/pdk-mediamtx-event unavailable
  runOnRead: /usr/local/bin/pdk-mediamtx-event read
  runOnUnread: /usr/local/bin/pdk-mediamtx-event unread

paths:
  "~^zhibo-live/ls_[A-Za-z0-9]{16,64}$": {}
