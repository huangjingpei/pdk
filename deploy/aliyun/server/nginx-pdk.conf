# ============================================================================
# PDK Nginx 站点（正式版：需要证书已存在）
# 部署时由 04-deploy.sh 替换占位符：
#   __PDK_ROOT__      -> /opt/pdk
#   __SERVER_NAME__   -> pdk.graddu.com
#   __BACKEND_PORT__  -> 8080
#   __SSL_CERT__      -> /etc/letsencrypt/live/pdk.graddu.com/fullchain.pem
#   __SSL_KEY__       -> /etc/letsencrypt/live/pdk.graddu.com/privkey.pem
#
# 关键：本文件【不使用 default_server】。
#   服务器上 80 的 default_server 已属于现有站点（live-chat），
#   抢过来会导致 nginx -t 失败、reload 中断，直接影响线上业务。
# ============================================================================

# ---------------- HTTP：证书验证 + 全站跳转 HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # certbot 续期用的 HTTP-01 路径，必须放在跳转规则之前，否则续期会失败
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/pdk-access.log;
    error_log  /var/log/nginx/pdk-error.log warn;
    server_tokens off;
}

# ---------------- HTTPS：正式站点 ----------------
server {
    # nginx 1.18 语法（1.25+ 才支持独立的 http2 on 指令）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:PDKSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root __PDK_ROOT__/www/admin;
    index index.html;

    # 客户端升级包可达数百 MB，上传/下载都要放宽
    client_max_body_size 520m;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;

    access_log /var/log/nginx/pdk-access.log;
    error_log  /var/log/nginx/pdk-error.log warn;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite 产物文件名带内容 hash，可安全长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- 后端 API 反向代理 ----
    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 升级包下载流很大，关闭缓冲避免先落盘再转发
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---- 监控端点只允许本机访问 ----
    location /actuator {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
    }

    # ---- 前端 SPA 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
