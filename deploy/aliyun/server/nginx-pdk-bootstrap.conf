# ============================================================================
# PDK Nginx 站点（引导版：证书还没签发时用，纯 HTTP）
# 目的：先让 80 端口能服务 /.well-known/acme-challenge/，
#       certbot 完成 HTTP-01 验证后，04-deploy.sh 会换成 nginx-pdk.conf 正式版。
#
# 占位符：__PDK_ROOT__  __SERVER_NAME__  __BACKEND_PORT__
#
# 同样【不使用 default_server】，避免与现有站点冲突。
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root __PDK_ROOT__/www/admin;
    index index.html;

    client_max_body_size 520m;
    client_body_timeout 300s;

    access_log /var/log/nginx/pdk-access.log;
    error_log  /var/log/nginx/pdk-error.log warn;
    server_tokens off;

    # certbot HTTP-01 验证路径，必须放在最前面
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /actuator {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
