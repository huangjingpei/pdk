server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pdk-commercial-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pdk_biz_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:89dfu*#$ewr87l}

  # 启动自动执行建表/种子 SQL（默认仅内嵌库生效，MySQL 需显式开启）
  # schema-mysql.sql 使用 IF NOT EXISTS / ON DUPLICATE KEY UPDATE，可重复执行
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
      encoding: UTF-8
      continue-on-error: false
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000 # 30天
  active-timeout: -1
  is-concurrent: false
  is-share: false
  token-style: uuid

# 业务安全配置
pdk:
  security:
    dynamic-window-minutes: 10
    magic-bytes: "5044" # 0x50 0x44
    token-lease-seconds: 300
