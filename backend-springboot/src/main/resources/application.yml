server:
  port: 8080
  servlet:
    context-path: /

spring:
  # 客户端升级的签名私钥/HMAC 密钥等敏感配置，统一从下面这个本地文件加载，
  # 这是它们【唯一】的来源——不要改用环境变量注入。
  #   原因：OS 环境变量在 Spring 中的优先级高于配置文件，一旦两边都存在，
  #   会出现 key-id 取自文件、私钥取自环境变量的静默分裂，表现为
  #   「后端签名正常、客户端验签必失败」，而日志毫无异常，极难排查。
  # 文件缺失不阻塞启动，但启动日志会打印精确路径提示，且发布/签发策略会直接失败。
  # 模板见：backend-springboot/config/client-update-keys.example.yml
  config:
    import:
      - optional:file:./config/client-update-keys.yml
  application:
    name: pdk-commercial-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist 让 JDBC 在首次启动时先创建库，随后 Spring SQL Init
    # 会自动执行 schema-mysql.sql。脚本本身保持幂等，可安全重复启动。
    url: ${DB_URL:jdbc:mysql://localhost:3306/pdk_biz_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASS:89dfu*#$ewr87l}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000

  # 启动自动执行建表/种子 SQL（默认仅内嵌库生效，MySQL 需显式开启）
  # schema-mysql.sql 使用 IF NOT EXISTS / ON DUPLICATE KEY UPDATE，可重复执行
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
      encoding: UTF-8
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: ${PDK_UPDATE_MAX_FILE_SIZE:512MB}
      max-request-size: ${PDK_UPDATE_MAX_REQUEST_SIZE:520MB}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      # 当前项目使用 StringRedisTemplate，不使用 Spring Data Redis Repository。
      # 关闭无用扫描，避免启动时出现“0 Redis repository interfaces”的干扰日志。
      repositories:
        enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 通过 SLF4J 控制 SQL 日志；需要调试 SQL 时设置 PDK_MAPPER_LOG_LEVEL=DEBUG。
    # 不再使用 StdOutImpl，避免定时任务每分钟直接向控制台打印 SqlSession/JDBC 细节。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  charset:
    console: GBK
  level:
    com.pdk.mapper: ${PDK_MAPPER_LOG_LEVEL:WARN}

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000 # 30天
  active-timeout: -1
  is-concurrent: false
  is-share: false
  token-style: uuid

# 业务安全配置
pdk:
  business:
    # 单体部署可用逗号分隔启用多个业务；ZHIBO 聚合别名会展开为 ZHIBO_AI,ZHIBO_LIVE。
    # 数据库 ACTIVE 只是管理开关，只有同时位于此部署白名单且 Handler 健康才真正可用。
    # 默认放开三个 bizCode 的部署能力，但 pdk_business 种子数据里 ZHIBO_AI/ZHIBO_LIVE 为 DISABLED，
    # 因此仍需管理员在「业务管理」页显式启用后才会变为 AVAILABLE。
    enabled-codes: ${PDK_ENABLED_BIZ_CODES:PDD,ZHIBO}
    legacy-default-app-id: ${PDK_LEGACY_DEFAULT_APP_ID:1}
    allow-legacy-missing-app-id: ${PDK_ALLOW_LEGACY_MISSING_APP_ID:true}
    # 部分业务部署允许数据库中其他 ACTIVE 业务呈现 NOT_IN_DEPLOYMENT；allowlist 自身缺 Handler 仍必定启动失败。
    fail-fast-active-unsupported: ${PDK_FAIL_FAST_ACTIVE_UNSUPPORTED:false}
  # 设备指纹克隆检测：salted hash 的盐。生产务必通过 PDK_FP_SALT 环境变量配置为至少 32 字节随机值。
  # 服务端用 sha256(salt + ":" + bizId) 派生「每租户盐」下发给客户端，避免跨租户指纹关联与预计算。
  fingerprint:
    salt: ${PDK_FP_SALT:change-me-fingerprint-salt-please-rotate}
    version: "1"
  sms:
    provider: ${PDK_SMS_PROVIDER:local}
    code-expire-minutes: 5
    local:
      fixed-code-enabled: ${PDK_SMS_FIXED_CODE_ENABLED:false}
      fixed-code: ${PDK_SMS_FIXED_CODE:888888}
    aliyun:
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
  zhibo-live:
    mediamtx:
      enabled: ${PDK_MEDIAMTX_ENABLED:false}
      public-rtmp-base-url: ${PDK_MEDIAMTX_PUBLIC_RTMP_BASE_URL:rtmp://localhost:1935}
      control-base-url: ${PDK_MEDIAMTX_CONTROL_BASE_URL:http://localhost:9997}
      node-code: ${PDK_MEDIAMTX_NODE_CODE:mediamtx-local}
      # 必须通过环境变量配置为至少 32 字节随机值；业务服务与 MediaMTX 共用。
      internal-service-token: ${PDK_MEDIAMTX_INTERNAL_SERVICE_TOKEN:}
      ticket-ttl-seconds: ${PDK_MEDIAMTX_TICKET_TTL_SECONDS:90}
  security:
    dynamic-window-minutes: 10
    magic-bytes: "5044" # 0x50 0x44
    token-lease-seconds: 300
    lease-recovery-interval-ms: 60000
    daily-counter-reset-cron: "0 0 0 * * *"
    scheduler-zone: Asia/Shanghai
    admin-password-pepper: ${PDK_ADMIN_PASSWORD_PEPPER:PDK_ADMIN_2026}
  client-update:
    # 下面全部是「没有密钥文件时也能把服务起起来」的本地默认值。
    # 真实值请写进 config/client-update-keys.yml，它会覆盖这里的同名项。
    # 刻意不写成 ${ENV_VAR:default} 形式：环境变量优先级高于配置文件，
    # 混用会导致 key-id 与私钥来自不同源的静默故障（详见上方 spring.config.import 注释）。
    enabled: true
    storage-root: ${java.io.tmpdir}/pdk-client-updates
    public-base-url: http://localhost:8080
    download-token-secret: change-me-download-token-secret-at-least-32-bytes
    event-token-secret: change-me-event-token-secret-at-least-32-bytes
    rollout-hmac-secret: change-me-rollout-secret-at-least-32-bytes
    rollout-key-version: "1"
    # 签名私钥默认留空：未配置时发布构件/签发策略会明确报错（50390），
    # 而不是用一把「谁都有」的默认私钥静默签出不可信的升级包。
    artifact-private-key: ""
    artifact-key-id: client-release-local-1
    artifact-public-key: ""
    policy-private-key: ""
    policy-key-id: client-policy-local-1
    policy-public-key: ""
    download-url-ttl-seconds: 600
    policy-ttl-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
